experiment:
  name: life-saving-appliance-object-centric-crop-control
  registered_on: 2026-08-05
  status: completed_negative_target_result
  purpose: test whether object-centric presentation, rather than repeated whole frames, repairs target localization

frozen_data:
  source_partition: artifacts/partitions/seed20260803/instances_detector_train.json
  source_partition_sha256: 9e10932e726d718d53d7923e7c20169b7bc947437980b9d23b8013bc15338490
  source_train_images: 6251
  target_positive_images: 323
  target_instances: 422
  target_category: life_saving_appliances
  original_exposures: 6251
  derived_exposures: 969
  total_exposures: 7220
  effective_target_instance_exposures: 1688
  forbidden_source_roles:
    - detector-dev
    - calibration-fit
    - policy-tune
    - official-validation

crop_recipe:
  derived_crops_per_target_positive_image: 3
  target_group_rule: union of all life_saving_appliances boxes in the source image
  context_factors: [8.0, 12.0, 16.0]
  minimum_native_crop_side: 384
  boundary_rule: expand until every intersecting active annotation is fully included
  label_rule: retain every fully contained active annotation; every target instance must appear in every derived crop
  jpeg:
    mode: RGB
    quality: 95
    subsampling: 0
    progressive: false
  source_images_modified: false

matched_control:
  comparator: Repeat4-1280
  same_total_training_exposures: true
  same_effective_target_instance_exposures: true
  only_intended_factor: repeated whole-frame exposures versus target-group-centered derived crops

training:
  model: yolov8n.pt
  model_initialization_sha256: f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36
  imgsz: 1280
  epochs: 100
  patience: 20
  batch: 4
  nominal_batch_size: 64
  amp: false
  seed: 20260803
  deterministic: true
  workers: 4
  optimizer: auto
  lr0_argument: 0.01
  checkpoint_selection: detector-dev aggregate fitness only

preflight:
  fraction: 0.02
  epochs: 1
  performance_claims_allowed: false
  required_before_full_training:
    - all data gates pass
    - all unit tests pass
    - training completes one epoch
    - stderr has no real error
    - best checkpoint model tensors are finite

evaluation:
  primary:
    - detector-dev target AP50-95
    - detector-dev target proposal recall at confidence 0.001 and IoU 0.50
  tradeoff:
    - detector-dev aggregate mAP50-95
    - detector-dev per-class AP50-95
  forbidden_for_selection:
    - official-validation
    - calibration-fit
    - policy-tune


analysis:
  name: detector-dev-oracle-target-crop-diagnostic
  registered_on: 2026-08-16
  status: completed_representation_supported
  scope: post-freeze diagnostic; no training and no deployment claim
  question: distinguish full-frame proposal/scale failure from target-class representation failure

frozen_inputs:
  annotations: artifacts/partitions/seed20260803/instances_detector_dev.json
  annotations_sha256: 70748e58e03e153513a38376b2ba928727cff13c0da302fb46b7c1a4e430e89e
  image_root: D:/dataset/SeaDronesSee_ODv2/compressed/images/train
  target_category: life_saving_appliances
  models:
    repeat4_1280:
      checkpoint: runs/detect/sds_v2_yolov8n_1280_seed20260803_rare4_noamp/weights/best.pt
      sha256: 3c96178bab23b6ea17964ff4913364be9edbe0f68b9e4710e677c494a10bc822
    crop4_1280:
      checkpoint: runs/detect/sds_v2_yolov8n_1280_seed20260803_crop4_noamp/weights/best.pt
      sha256: fb7224877a4e1b996b38dbe9582e90aa774fe7e4c234c13a49441be630f67f11

crop_protocol:
  unit: one crop per target-positive detector-dev image and context factor
  target_group_rule: union of all target boxes in the image
  context_factors: [8.0, 12.0, 16.0]
  minimum_native_crop_side: 384
  boundary_rule: expand until every intersecting active annotation is fully included
  oracle_information_used: target location and extent from detector-dev annotations

inference:
  imgsz: 1280
  confidence_floor: 0.001
  nms_iou: 0.70
  batch: 4
  device: 0
  half: false
  augment: false

endpoints:
  primary:
    - same-class target recall at IoU 0.50 by context factor and model
    - maximum and mean same-class IoU by context factor and model
  diagnostic:
    - any-class localization at IoU 0.10, 0.30, and 0.50
    - target prediction count and maximum score
    - target pixel occupancy after crop resizing

decision_rule:
  representation_supported: Crop4 has positive same-class recall at IoU 0.50 on an oracle crop
  representation_not_supported: Crop4 remains at zero same-class recall for all frozen contexts
  factors_are_not_selected: all three contexts are reported; no best context becomes a deployment setting

claim_boundary:
  - oracle crops use ground-truth target locations and cannot be deployed as a detector
  - detector-dev is reused only after checkpoint and threshold freeze
  - calibration-fit, policy-tune, official validation, checkpoint selection, and threshold selection are prohibited
  - this diagnostic does not authorize new training

outputs:
  versioned_results: results/sensitivities/oracle_target_crop_diagnostic
  script: scripts/analyze_oracle_target_crops.py
  report: docs/ORACLE_TARGET_CROP_DIAGNOSTIC.md

results:
  target_ground_truth_per_context: 64
  target_positive_images: 64
  repeat4_1280:
    context_8:
      same_class_recall_iou_0_50: 0/64
      target_predictions: 0
    context_12:
      same_class_recall_iou_0_50: 0/64
      target_predictions: 0
    context_16:
      same_class_recall_iou_0_50: 0/64
      target_predictions: 0
  crop4_1280:
    context_8:
      same_class_recall_iou_0_50: 17/64
      target_predictions: 73
      maximum_target_score: 0.8013299703598022
    context_12:
      same_class_recall_iou_0_50: 22/64
      target_predictions: 87
      maximum_target_score: 0.8013299703598022
    context_16:
      same_class_recall_iou_0_50: 23/64
      target_predictions: 139
      maximum_target_score: 0.8013299703598022
  representation_supported: true
  interpretation: Crop4 learns a recognizable target representation, but full-frame inference lacks a deployable proposal or tiling path that presents the small target at the learned scale and context
  next_candidate: separately registered blind tiling inference sensitivity on detector-dev, with no oracle locations and no official validation

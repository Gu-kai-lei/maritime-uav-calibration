frozen_audit_rules:
  target_match_iou: 0.50
  descriptive_near_iou: 0.10
  residual_neighbor_iou: 0.50
  overlap_fraction: 0.25
  taxonomy_precedence:
    - true_positive
    - duplicate_on_matched_target
    - target_localization_error
    - overlaps_other_class
    - near_other_class
    - background
  score_bins: [0.001, 0.01, 0.05, 0.10, 0.25, 1.01]
  grid_diagnostic: distance to or crossing of any reconstructed internal tile-grid boundary
  source_concentration: share of false positives contributed by the top 10 percent of source videos

claim_boundary:
  - use uncapped target-class exports after the already frozen cross-tile NMS
  - do not remove, rescore, or rerun any prediction
  - do not select a tile size, threshold, checkpoint, merge rule, or deployment configuration
  - detector-dev is reused descriptive evidence and cannot validate a future proposal rule
  - original tile provenance was not retained; grid alignment is geometric association, not causal attribution
  - calibration-fit, policy-tune, official validation, and official test are prohibited
  - this audit does not authorize new training

outputs:
  versioned_results: results/sensitivities/blind_tiling_fp_audit
  analysis_script: scripts/analyze_blind_tiling_false_positives.py
  tests: tests/test_blind_tiling_false_positives.py
  report: docs/BLIND_TILING_FP_AUDIT.md


evaluation:
  primary:
    - detector-dev target AP50-95
    - detector-dev target proposal recall at confidence 0.001 and IoU 0.50
  tradeoff:
    - detector-dev aggregate mAP50-95
    - detector-dev per-class AP50-95
  one_time_diagnostics:
    - calibration-fit target proposal recall
    - policy-tune target proposal recall
  forbidden_for_selection:
    - official validation
    - calibration-fit
    - policy-tune

stage_gates:
  - completed: one-epoch 2-percent repeat4_640 launch preflight; performance claims forbidden
  - completed: repeat4_640 natural early stopping and frozen best-checkpoint evaluation
  - completed: natural_1280 independent resolution main-effect cell
  - completed: repeat4_1280 interaction cell and strict four-cell analysis


analysis:
  name: detector-dev-blind-tiling-inference-sensitivity
  registered_on: 2026-08-16
  status: completed_target_path_supported_not_deployment_ready
  scope: post-freeze inference diagnostic; no training and no deployment selection
  question: test whether a location-blind tiling path restores full-image target proposals

frozen_inputs:
  annotations: artifacts/partitions/seed20260803/instances_detector_dev.json
  annotations_sha256: 70748e58e03e153513a38376b2ba928727cff13c0da302fb46b7c1a4e430e89e
  image_root: D:/dataset/SeaDronesSee_ODv2/compressed/images/train
  target_category: life_saving_appliances
  models:
    repeat4_1280:
      role: negative_control
      checkpoint: runs/detect/sds_v2_yolov8n_1280_seed20260803_rare4_noamp/weights/best.pt
      sha256: 3c96178bab23b6ea17964ff4913364be9edbe0f68b9e4710e677c494a10bc822
      full_frame_predictions: artifacts/sensitivities/rare_class_factorial/predictions/repeat4_1280_detector_dev.json
    crop4_1280:
      role: representation_supported_model
      checkpoint: runs/detect/sds_v2_yolov8n_1280_seed20260803_crop4_noamp/weights/best.pt
      sha256: fb7224877a4e1b996b38dbe9582e90aa774fe7e4c234c13a49441be630f67f11
      full_frame_predictions: artifacts/sensitivities/object_centric_crop_control/predictions/crop4_1280_detector_dev.json

tiling_protocol:
  unit: every detector-dev image; no annotation locations used by inference
  native_tile_sizes: [384, 768]
  overlap_fraction: 0.25
  boundary_rule: anchor the final tile to the far image edge so every pixel is covered
  tile_resize_imgsz: 1280
  confidence_floor: 0.001
  within_tile_nms_iou: 0.70
  cross_tile_class_aware_nms_iou: 0.70
  max_detections_per_tile: 300
  max_detections_per_image_for_primary_metrics: 300
  retain_uncapped_target_after_cross_tile_nms: true
  half: false
  augment: false
  device: 0
  inference_batch: 16
  batch_freeze_basis: throughput-only preflight; 1.31 GiB peak allocated on the local RTX 4070 Laptop GPU

endpoints:
  primary:
    - same-class life_saving_appliances proposal recall at IoU 0.50
    - aggregate and per-class AP50 and AP50-95 with the 300-detection cap
  diagnostic:
    - uncapped target proposal recall after cross-tile NMS
    - false positives per image at the export confidence floor
    - tile count and end-to-end latency distribution
    - peak CUDA memory

decision_rule:
  factors_are_not_selected: both tile sizes and both models are reported; detector-dev cannot select a deployment tile size
  target_path_supported: Crop4 blind tiling has positive same-class target recall at IoU 0.50
  target_path_not_supported: Crop4 remains at zero target recall for both frozen tile sizes

claim_boundary:
  - detector-dev is reused only after checkpoint and threshold freeze
  - no target annotation location is visible to the tiling inference path
  - calibration-fit, policy-tune, official validation, checkpoint selection, threshold selection, and tile-size selection are prohibited
  - latency is machine- and implementation-specific diagnostic evidence
  - this diagnostic does not authorize new training

outputs:
  predictions: artifacts/sensitivities/blind_tiling_inference/predictions
  versioned_results: results/sensitivities/blind_tiling_inference
  export_script: scripts/export_blind_tiled_predictions.py
  analysis_script: scripts/analyze_blind_tiling_sensitivity.py
  report: docs/BLIND_TILING_INFERENCE_SENSITIVITY.md

